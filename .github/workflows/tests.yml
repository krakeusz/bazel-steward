name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04-arm
    name: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Cache CI environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ci-environment-v2-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'maven_install.json', '.pre-commit-config.yaml', 'Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ci-environment-v2-
      - name: Build CI environment
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-cache"
          docker build --platform linux/arm64 --target ci --tag bazel-steward-ci .
      - name: Configure CI remote cache
        env:
          BUILDBARN_REMOTE_CACHE: ${{ vars.BUILDBARN_REMOTE_CACHE }}
          BUILDBARN_REMOTE_INSTANCE_NAME: ${{ vars.BUILDBARN_REMOTE_INSTANCE_NAME }}
          BUILDBARN_CI_TOKEN: ${{ secrets.BUILDBARN_CI_TOKEN }}
        run: |
          if [[ -n "${BUILDBARN_REMOTE_CACHE}" && -n "${BUILDBARN_CI_TOKEN}" ]]; then
            printf '%s\n' \
              "build:ci --remote_cache=${BUILDBARN_REMOTE_CACHE}" \
              "build:ci --remote_instance_name=${BUILDBARN_REMOTE_INSTANCE_NAME:-bazel-steward}" \
              "build:ci --remote_header=authorization=Bearer ${BUILDBARN_CI_TOKEN}" \
              "build:ci --remote_upload_local_results=true" \
              > .bazelrc.local
          fi
      - name: Run tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env GITHUB_TOKEN \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/ci-cache:/var/cache/ci" \
            --workdir /workspace \
            bazel-steward-ci \
            bazel test --keep_going --test_tag_filters=unit --config=ci -- //...
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove CI remote-cache credential
        if: always()
        run: rm -f .bazelrc.local

  integration-shard-tests:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: integration-core
            target: "//... -//e2e/src/test/kotlin/org/virtuslab/bazelsteward/e2e/rules:all"
          - name: integration-rules
            target: "//e2e/src/test/kotlin/org/virtuslab/bazelsteward/e2e/rules:all"
    name: ${{ matrix.name }}-tests
    steps:
      - uses: actions/checkout@v4
      - name: Cache CI environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ci-environment-v2-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'maven_install.json', '.pre-commit-config.yaml', 'Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ci-environment-v2-
      - name: Build CI environment
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-cache"
          docker build --platform linux/arm64 --target ci --tag bazel-steward-ci .
      - name: Run integration tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env GITHUB_TOKEN \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/ci-cache:/var/cache/ci" \
            --workdir /workspace \
            bazel-steward-ci \
            bazel test --keep_going --test_tag_filters=integration --config=ci -- ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    runs-on: ubuntu-latest
    name: integration-tests
    needs:
      - integration-shard-tests
    steps:
      - name: Integration umbrella passed
        run: echo "All integration test jobs passed."

  static-analysis:
    runs-on: ubuntu-24.04-arm
    name: static-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Cache CI environment
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ci-environment-v2-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'maven_install.json', '.pre-commit-config.yaml', 'Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ci-environment-v2-
      - name: Build CI environment
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-cache"
          docker build --platform linux/arm64 --target ci --tag bazel-steward-ci .
      - name: Run pre-commit
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/ci-cache:/var/cache/ci" \
            --workdir /workspace \
            bazel-steward-ci \
            pre-commit run --all-files

  # Runs steward against the bazel-steward repo itself (real MODULE.bazel,
  # maven_install.json, full git history) to catch regressions on real-world input.
  test-smoke-steward-on-its-repo:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run steward on this repo
        uses: ./
        with:
          use-release: "false"
          push-to-remote: "false"
        env:
          DOCKER_CACHE_FROM: type=gha,scope=docker-steward
          DOCKER_CACHE_TO: type=gha,mode=max,scope=docker-steward

  # Runs steward from a separate action-src checkout against a minimal consumer
  # fixture, verifying the cross-repo consumption pattern (issue #459).
  test-smoke-steward-on-external-repo:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: action-src
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Materialize consumer repo at workspace root
        run: ./action-src/tools/smoke/setup-consumer.sh
      - name: Run bazel-steward from consumer (use-release false)
        uses: ./action-src
        with:
          use-release: "false"
          push-to-remote: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CACHE_FROM: type=gha,scope=docker-steward
          DOCKER_CACHE_TO: type=gha,mode=max,scope=docker-steward

  smoke-tests:
    runs-on: ubuntu-24.04-arm
    name: smoke-tests
    needs:
      - test-smoke-steward-on-its-repo
      - test-smoke-steward-on-external-repo
    steps:
      - name: Smoke umbrella passed
        run: echo "All smoke test jobs passed."
